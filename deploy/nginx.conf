# ============================================================
# Nginx config for Polymarket Arb Bot on Hostinger VPS
# ============================================================
# 1. Copy to: /etc/nginx/sites-available/polymarket-bot
# 2. ln -s /etc/nginx/sites-available/polymarket-bot /etc/nginx/sites-enabled/
# 3. nginx -t && systemctl reload nginx
# ============================================================

server {
    listen 80;
    server_name TUDOMINIO.COM www.TUDOMINIO.COM;

    # Redirect HTTP → HTTPS (uncomment after adding SSL)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 86400;
    }
}

